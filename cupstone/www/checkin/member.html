{% extends "templates/web.html" %}

{% block page_content %}
{% if invalid_token %}
  <h2>Invalid or Expired Token</h2>
  <p>This QR code is no longer valid.</p>
{% elif valid_token %}
  <h2>Member Check-In</h2>

  <form method="post" action="/api/method/cupstone.attendance.api.send_otp.send_otp" id="otp-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">
    
    <label>Enter Member ID</label><br>
    <input type="text" name="member_id" required><br><br>
    <button type="submit">Send OTP</button>
  </form>

  <div id="otp-section" style="display: none; margin-top: 20px;">
    <form method="post" action="/api/method/cupstone.attendance.api.verify_otp" id="verify-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="hidden" name="member_id" id="verify-member-id">
      <label>Enter OTP</label><br>
      <input type="text" name="otp" required><br><br>
      <button type="submit">Verify & Check-In</button>
    </form>
  </div>

  <script>
    document.getElementById("otp-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);

      fetch(form.action, {
        method: "POST",
        body: data,
        credentials: "same-origin"
      })
      .then(res => res.json())
      .then(res => {
        if (res.message) {
          // Wait 3 seconds then show OTP input
          setTimeout(() => {
            document.getElementById("otp-section").style.display = "block";
            document.getElementById("verify-member-id").value = form.member_id.value;
          }, 3000);
        }
      });
    });
  </script>
{% endif %}
{% endblock %}
